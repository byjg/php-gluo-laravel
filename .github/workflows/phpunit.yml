name: PHPUnit

on:
  push:
    branches:
      - master
    tags:
      - "*.*.*"
  pull_request:
    branches:
      - master

jobs:
  Build:
    name: Build (PHP ${{ matrix.php-version }}, Laravel ${{ matrix.laravel }})
    runs-on: 'ubuntu-latest'
    container:
      image: 'byjg/php:${{ matrix.php-version }}-cli'
      options: --user root --privileged

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.6"
          - "8.5"
          - "8.4"
          - "8.3"
        laravel:
          - "12"
          - "13"
        include:
          # orchestra/testbench release line that pulls each Laravel version
          - laravel: "12"
            testbench: "^10.0"
          - laravel: "13"
            testbench: "^11.0"
        exclude:
          # Laravel 12 does not run on PHP 8.6: it calls the deprecated
          # spl_object_hash() and its ArraySessionHandler lacks create_sid(),
          # which PHP 8.6 raises as a warning. Laravel 13 fixes both.
          - php-version: "8.6"
            laravel: "12"

    steps:
      - uses: actions/checkout@v7
      - name: Pin the Laravel version under test
        run: composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}"
      - run: composer update --prefer-dist --no-interaction
      - run: ./vendor/bin/phpunit

  Psalm:
    name: Psalm Static Analyzer
    runs-on: ubuntu-latest
    permissions:
      # for github/codeql-action/upload-sarif to upload SARIF results
      security-events: write
    container:
      image: byjg/php:8.5-cli
      options: --user root --privileged

    steps:
      - name: Git checkout
        uses: actions/checkout@v7

      - name: Composer
        run: composer install

      - name: Psalm
        # Note: Ignoring error code 2, which just signals that some
        # flaws were found, not that Psalm itself failed to run.
        run: ./vendor/bin/psalm.phar
          --show-info=true
          --report=psalm-results.sarif || [ $? = 2 ]

      - name: Upload Analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        if: github.ref == 'refs/heads/master'
        with:
          sarif_file: psalm-results.sarif

  Documentation:
    if: github.ref == 'refs/heads/master'
    needs: Build
    uses: byjg/byjg.github.io/.github/workflows/add-doc.yaml@master
    with:
      folder: php
      project: ${{ github.event.repository.name }}
    secrets:
      DOC_TOKEN: ${{ secrets.DOC_TOKEN }}

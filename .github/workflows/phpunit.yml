name: PHPUnit

on:
  push:
    branches:
      - master
    tags:
      - "*.*.*"
  pull_request:
    branches:
      - master

jobs:
  Build:
    runs-on: 'ubuntu-latest'
    container:
      image: 'byjg/php:${{ matrix.php-version }}-cli'
      options: --user root --privileged

    strategy:
      fail-fast: false
      matrix:
        php-version:
          # PHP 8.6 is excluded: orchestra/testbench pulls laravel/framework ->
          # league/commonmark -> league/config -> nette/schema, which caps at
          # php 8.1 - 8.5. The runtime dependencies themselves install on 8.6,
          # so the composer constraint still allows it - only the test harness
          # cannot run there yet.
          - "8.5"
          - "8.4"
          - "8.3"
        testbench:
          # Laravel 12
          - "^10.0"
          # Laravel 13
          - "^11.0"

    steps:
      - uses: actions/checkout@v5
      - name: Pin the Laravel version under test
        run: composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}"
      - run: composer update --prefer-dist --no-interaction
      - run: ./vendor/bin/phpunit

  Psalm:
    name: Psalm Static Analyzer
    runs-on: ubuntu-latest
    permissions:
      # for github/codeql-action/upload-sarif to upload SARIF results
      security-events: write
    container:
      image: byjg/php:8.5-cli
      options: --user root --privileged

    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Composer
        run: composer install

      - name: Composer (psalm)

        run: composer --working-dir=tools/psalm update --no-interaction


      - name: Psalm
        # Note: Ignoring error code 2, which just signals that some
        # flaws were found, not that Psalm itself failed to run.
        run: ./tools/psalm/vendor/bin/psalm
          --show-info=true
          --report=psalm-results.sarif || [ $? = 2 ]

      - name: Upload Analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        if: github.ref == 'refs/heads/master'
        with:
          sarif_file: psalm-results.sarif

  Documentation:
    if: github.ref == 'refs/heads/master'
    needs: Build
    uses: byjg/byjg.github.io/.github/workflows/add-doc.yaml@master
    with:
      folder: php
      project: ${{ github.event.repository.name }}
    secrets:
      DOC_TOKEN: ${{ secrets.DOC_TOKEN }}
